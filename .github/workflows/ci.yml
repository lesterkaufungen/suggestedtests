name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- native --
  rust-test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --release --locked -- -D warnings
        working-directory: native
      - run: cargo test --release --locked
        working-directory: native

  prebuilt:
    name: prebuilt (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: linux, os: ubuntu-latest }
          - { family: macos, os: macos-latest }
          - { family: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.family == 'linux'
        run: pip install ziglang
      - if: matrix.family == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: tool/build_prebuilt.sh ${{ matrix.family }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.family }}
          path: native/prebuilt/
          if-no-files-found: error

  # Prove the Linux builds load where they claim to.
  linux-libc-compat:
    name: load on Alpine (musl) / CentOS 7 (glibc 2.17)
    needs: prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-linux
          path: native/prebuilt/
      - name: musl build on Alpine
        run: >
          docker run --rm -v "$PWD:/w" -w /w alpine:3
          sh -c "apk add -q python3 &&
          python3 tool/check_load.py native/prebuilt/linux-x64-musl/libsuggestedtests_native.so"
      - name: glibc build on CentOS 7 (glibc 2.17)
        run: >
          docker run --rm -v "$PWD:/w" -w /w centos:7
          python tool/check_load.py native/prebuilt/linux-x64/libsuggestedtests_native.so

  # One artifact with every platform, ready to drop into native/prebuilt/
  # before `dart pub publish`.
  prebuilt-all:
    needs: prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: prebuilt/
          merge-multiple: true
      - run: find prebuilt -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-all
          path: prebuilt/

  # ------------------------------------------------------------------ dart --
  flutter-test:
    name: flutter test (${{ matrix.os }})
    needs: prebuilt-all
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-all
          path: native/prebuilt/
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The prebuilt library must be used as-is: hide cargo so the hook
      # cannot silently fall back to a source build.
      - name: Hide cargo
        shell: bash
        run: |
          for d in "$HOME/.cargo/bin" "$USERPROFILE/.cargo/bin" /usr/share/rust/.cargo/bin; do
            [ -d "$d" ] && mv "$d" "$d.hidden" || true
          done
          ! command -v cargo
      - run: flutter pub get
      - if: matrix.os == 'ubuntu-latest'
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter pub publish --dry-run
      - run: flutter test
      - run: flutter test example/example.dart

[package]
name = "suggestedtests_node"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Node-API addon exposing the suggestedtests bridge to Node.js."
publish = false

[lib]
# Built as a shared library and shipped renamed to suggestedtests_native.node.
crate-type = ["cdylib"]

[dependencies]
suggestedtests_native = { path = ".." }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "suggestedtests"
version = "0.1.2"
description = "pytest helpers: performance and memory budgets backed by a native OS bridge, eventually, given/when/then steps, seeded test data and leak checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Lester K." }]
keywords = ["testing", "pytest", "performance", "benchmark", "memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lesterkaufungen/suggestedtests/tree/main/packages/python"
Issues = "https://github.com/lesterkaufungen/suggestedtests/issues"

# pytest loads the plugin automatically once the package is installed.
[project.entry-points.pytest11]
suggestedtests = "suggestedtests.pytest_plugin"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.6", "build>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/suggestedtests"]

# Bundles native/prebuilt/ from the monorepo; see hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "hatch_build.py", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# D1: every public module, class and function needs a docstring.
select = ["E", "F", "W", "I", "B", "UP", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]
"hatch_build.py" = ["D"]
